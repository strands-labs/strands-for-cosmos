name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (ubuntu, py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools-scm needs tags for the version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Sync (locked, CPU wheels only)
        run: uv sync --locked --extra dev --extra cosmos3
      - name: Lint (ruff, non-blocking until the baseline is clean)
        run: uv run ruff check strands_cosmos tests || true
      - name: Test
        run: uv run pytest tests -q --maxfail=5
