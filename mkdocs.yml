site_name: Strands Cosmos
site_url: https://strands-labs.github.io/strands-for-cosmos/
site_description: NVIDIA Cosmos for Strands Agents — Cosmos 3 omnimodal reasoning and generation, plus edge VLM (Cosmos-Reason2) on local compute.
repo_url: https://github.com/strands-labs/strands-for-cosmos
repo_name: strands-labs/strands-for-cosmos
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: Space Grotesk
    code: JetBrains Mono
  logo: assets/img/mark.svg
  favicon: assets/img/mark.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: paper
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Paper
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/strands-labs/strands-for-cosmos
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/strands-cosmos/

nav:
  - Home: index.md
  - Start:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
  - Notebooks: notebooks.md
  - Guide:
    - Cosmos 3 (Omnimodal): guide/cosmos3.md
    - Cosmos 3 Training (SFT): guide/cosmos3-training.md
    - Video Understanding: guide/video-understanding.md
    - Image Reasoning: guide/image-reasoning.md
    - Chain-of-Thought: guide/chain-of-thought.md
    - Tool Usage: guide/tool-usage.md
    - Jetson Deployment: guide/jetson.md
  - Examples:
    - Overview: examples/overview.md
    - Basic Text: examples/basic-text.md
    - Video Caption: examples/video-caption.md
    - Driving Analysis: examples/driving.md
    - Embodied Reasoning: examples/embodied.md
    - Tool Usage: examples/tool-usage.md
  - Architecture: architecture.md
  - Reference:
    - API Reference: api-reference.md
    - Changelog: changelog.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.betterem
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
